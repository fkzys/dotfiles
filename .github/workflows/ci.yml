name: CI

on:
  push:
    paths:
      - 'files/.local/bin/git'
      - 'files/.local/bin/rewrite_secret_history.py'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'files/.local/bin/git'
      - 'files/.local/bin/rewrite_secret_history.py'
      - 'tests/**'
      - '.github/workflows/ci.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck -s bash files/.local/bin/git tests/test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/test.sh

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --no-cache-dir pytest git-filter-repo
      - run: python -m pytest tests/test_rewrite_secret_history.py -v
